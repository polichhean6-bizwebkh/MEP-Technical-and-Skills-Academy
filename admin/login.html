<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Sign In | MEP Technical and Skills Academy</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/polish.js" defer></script>
</head>
<body class="admin-body" data-no-auth="true">
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="mark">MEP</div>
      <div><strong>MEP Academy CMS</strong><span>Admin Dashboard</span></div>
    </div>
    <h2>Sign In</h2>
    <p class="sub">Access the training academy management dashboard.</p>
    <div class="login-error" id="login-error">Incorrect email or password. Please try again.</div>
    <form id="login-form">
      <div class="a-field">
        <label>Email</label>
        <input type="email" name="email" required placeholder="admin@mepacademy-demo.kh">
      </div>
      <div class="a-field">
        <label>Password</label>
        <input type="password" name="password" required placeholder="••••••••">
      </div>
      <button type="submit" class="a-btn a-btn-primary a-btn-block">Sign In</button>
    </form>
    <div class="login-hint">Preview access — Email: <strong>admin@mepacademy-demo.kh</strong> · Password: <strong>admin123</strong></div>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
  window.PAGE_INIT = function (data) {
    var form = document.getElementById("login-form");
    var errorBox = document.getElementById("login-error");
    if (MEP.isLoggedIn()) { window.location.href = "index.html"; return; }
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var email = form.elements.namedItem("email").value.trim();
      var pass = form.elements.namedItem("password").value;
      if (email.toLowerCase() === data.admin.email.toLowerCase() && pass === data.admin.password) {
        MEP.setLoggedIn(true);
        window.location.href = "index.html";
      } else {
        errorBox.style.display = "block";
      }
    });
  };
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile | MEP Academy Admin</title>
<link rel="stylesheet" href="../css/admin.css">
<script src="../js/polish.js" defer></script>
</head>
<body class="admin-body" data-page-title="Profile">
<div class="admin-shell">
  <aside class="a-sidebar" id="a-sidebar"></aside>
  <div class="a-main">
    <header class="a-topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="a-sidebar-toggle" id="a-sidebar-toggle">☰</button>
        <h1 id="a-page-title">Profile</h1>
      </div>
      <div class="a-topbar-actions"><div class="a-user" id="a-user-info"></div></div>
    </header>
    <main class="a-content">
      <div class="a-panel">
        <div class="a-panel-head"><h3>Admin Account</h3></div>
        <div class="a-panel-body">
          <div class="a-info-row"><span>Email</span><span id="profile-email"></span></div>
          <div class="a-info-row"><span>Role</span><span>Administrator</span></div>
          <div class="a-info-row"><span>Access</span><span>Full Dashboard Access</span></div>
        </div>
      </div>
      <div class="a-panel">
        <div class="a-panel-head"><h3>Change Password</h3></div>
        <div class="a-panel-body a-form-grid">
          <div class="a-field"><label>Current Password</label><input type="password" placeholder="••••••••"></div>
          <div class="a-field"></div>
          <div class="a-field"><label>New Password</label><input type="password" placeholder="••••••••"></div>
          <div class="a-field"><label>Confirm New Password</label><input type="password" placeholder="••••••••"></div>
        </div>
        <div class="a-panel-body" style="padding-top:0">
          <button class="a-btn a-btn-primary" id="btn-change-pass">Update Password</button>
        </div>
      </div>
    </main>
  </div>
</div>
<script src="../js/data.js"></script>
<script src="../js/admin.js"></script>
<script>
  window.PAGE_INIT = function (data) {
    document.getElementById("profile-email").textContent = data.admin.email;
    document.getElementById("btn-change-pass").addEventListener("click", function () {
      var inputs=Array.from(document.querySelectorAll('input[type=password]'));
      var fresh=MEP.load();
      if(inputs[0].value!==fresh.admin.password){ADMIN.toast('Current password is incorrect.');return;}
      if(inputs[1].value.length<8||inputs[1].value!==inputs[2].value){ADMIN.toast('Use at least 8 characters and ensure the new passwords match.');return;}
      fresh.admin.password=inputs[1].value;MEP.save(fresh);inputs.forEach(function(i){i.value='';});ADMIN.toast('Preview password updated in this browser.');
    });
  };
</script>
</body>
</html>
